#############################################################
# TechWave DevOps Platform
#
# Component: Grafana
#
# Purpose:
# Central visualization platform used to display:
#
# - Prometheus metrics
# - Loki logs
# - Kubernetes monitoring data
# - Infrastructure monitoring data
# - Executive KPIs
#
# Dashboards are provisioned automatically using
# ConfigMaps and mounted at startup.
#
#############################################################

apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: monitoring

spec:

  ###########################################################
  # Number of Grafana replicas
  ###########################################################

  replicas: 1

  ###########################################################
  # Deployment Selector
  ###########################################################

  selector:
    matchLabels:
      app: grafana

  ###########################################################
  # Pod Template
  ###########################################################

  template:

    metadata:
      labels:
        app: grafana

    spec:

      #######################################################
      # Grafana Container
      #######################################################

      containers:

        - name: grafana

          image: grafana/grafana:11.2.0

          imagePullPolicy: IfNotPresent

          ###################################################
          # Web Interface
          ###################################################

          ports:
            - containerPort: 3000

          ###################################################
          # Administrator Credentials
          #
          # For production environments use Secrets.
          ###################################################

          env:

            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123

          ###################################################
          # Volume Mounts
          ###################################################

          volumeMounts:

            #################################################
            # Datasources Provisioning
            #################################################

            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources

            #################################################
            # Dashboard Provider Provisioning
            #################################################

            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards

            #################################################
            # Application Dashboard
            #################################################

            - name: application-dashboard
              mountPath: /var/lib/grafana/dashboards/application

            #################################################
            # Kubernetes Dashboard
            #################################################

            - name: kubernetes-dashboard
              mountPath: /var/lib/grafana/dashboards/kubernetes

            #################################################
            # Infrastructure Dashboard
            #################################################

            - name: infrastructure-dashboard
              mountPath: /var/lib/grafana/dashboards/infrastructure

            #################################################
            # Executive Dashboard
            #################################################

            - name: executive-dashboard
              mountPath: /var/lib/grafana/dashboards/executive

      #######################################################
      # Volumes
      #######################################################

      volumes:

        #####################################################
        # Datasources ConfigMap
        #####################################################

        - name: datasources
          configMap:
            name: grafana-datasources

        #####################################################
        # Dashboard Provider ConfigMap
        #####################################################

        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider

        #####################################################
        # Application Dashboard ConfigMap
        #####################################################

        - name: application-dashboard
          configMap:
            name: grafana-application-dashboard

        #####################################################
        # Kubernetes Dashboard ConfigMap
        #####################################################

        - name: kubernetes-dashboard
          configMap:
            name: grafana-kubernetes-dashboard

        #####################################################
        # Infrastructure Dashboard ConfigMap
        #####################################################

        - name: infrastructure-dashboard
          configMap:
            name: grafana-infrastructure-dashboard

        #####################################################
        # Executive Dashboard ConfigMap
        #####################################################

        - name: executive-dashboard
          configMap:
            name: grafana-executive-dashboard


