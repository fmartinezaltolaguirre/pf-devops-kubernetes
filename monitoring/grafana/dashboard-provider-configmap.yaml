apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  namespace: monitoring

data:
  dashboard-provider.yaml: |
    apiVersion: 1

    providers:

      - name: 'TechWave Dashboards'

        orgId: 1

        folder: 'TechWave'

        type: file

        disableDeletion: false

        editable: true

        options:
          path: /var/lib/grafana/dashboards
