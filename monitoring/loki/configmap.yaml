#############################################################
# TechWave DevOps Platform
#
# Component: Loki
#
# Purpose:
# Centralized log storage system used to collect,
# index and query logs generated by the platform.
#
# Integrated Components:
# - Promtail
# - Grafana
# - Kubernetes
#
# Deployment Mode:
# Single Binary / Single Node
#
#############################################################

apiVersion: v1
kind: ConfigMap

metadata:
  name: loki-config
  namespace: monitoring

data:

  ###########################################################
  # Loki Configuration
  ###########################################################

  loki.yaml: |

    #########################################################
    # Authentication
    #########################################################

    auth_enabled: false

    #########################################################
    # HTTP Server
    #########################################################

    server:

      http_listen_port: 3100

      grpc_listen_port: 9095

    #########################################################
    # Common Settings
    #########################################################

    common:

      path_prefix: /loki

      #######################################################
      # Local Storage
      #######################################################

      storage:

        filesystem:

          chunks_directory: /loki/chunks

          rules_directory: /loki/rules

      #######################################################
      # Single Node Configuration
      #######################################################

      replication_factor: 1

      #######################################################
      # Avoid Consul / Etcd
      #######################################################

      ring:

        kvstore:

          store: inmemory

    #########################################################
    # Schema Configuration
    #########################################################

    schema_config:

      configs:

        - from: 2025-01-01

          store: tsdb

          object_store: filesystem

          schema: v13

          index:

            prefix: index_

            period: 24h

    #########################################################
    # Alerting Integration
    #########################################################

    ruler:

      alertmanager_url: http://alertmanager.monitoring.svc.cluster.local:9093

    #########################################################
    # Query Limits
    #########################################################

    limits_config:

      allow_structured_metadata: false

      reject_old_samples: true

      reject_old_samples_max_age: 168h

    #########################################################
    # Analytics
    #########################################################

    analytics:

      reporting_enabled: false
