data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: 'prometheus'
        static_configs:
          - targets:
              - localhost:9090

      - job_name: 'techwave-app'
        metrics_path: /metrics
        static_configs:
          - targets:
              - techwave-service.techwave.svc.cluster.local:3000

      - job_name: 'node-exporter'
        static_configs:
          - targets:
              - node-exporter.monitoring.svc.cluster.local:9100

      - job_name: 'cadvisor'
        static_configs:
          - targets:
              - cadvisor.monitoring.svc.cluster.local:8080
