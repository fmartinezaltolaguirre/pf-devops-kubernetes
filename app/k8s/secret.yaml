# ==========================================
# Secretos de la aplicación
# Los valores reales NO deben versionarse en Git.
# Generar el Secret en el entorno con kubectl, External Secrets o un gestor de secretos.
# ==========================================

apiVersion: v1
kind: Secret

metadata:
  name: techwave-secret
  namespace: techwave

type: Opaque

stringData:
  # Sustituir por un valor real en el entorno de despliegue.
  # Ejemplo:
  # kubectl create secret generic techwave-secret -n techwave --from-literal=API_KEY='tu-valor-real'
  API_KEY: "REPLACE_ME"
