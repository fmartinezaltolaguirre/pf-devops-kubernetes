#############################################################
# TechWave DevOps Platform
#
# CI/CD Pipeline
#
# Responsibilities:
# - Validate source code
# - Execute automated tests
# - Build Docker images
# - Scan images for vulnerabilities
# - Publish images to GHCR
# - Deploy application to Kubernetes
# - Validate deployment
# - Perform automatic rollback on failure
#
#############################################################

name: TechWave CI/CD

#############################################################
# Trigger Conditions
#############################################################

on:

  # Executes when changes are pushed to main
  push:
    branches:
      - main

  # Executes validation on Pull Requests
  pull_request:
    branches:
      - main

#############################################################
# GitHub Permissions
#############################################################

permissions:
  contents: read
  packages: write

#############################################################
# Global Variables
#############################################################

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/techwave-app

#############################################################
# Pipeline Definition
#############################################################

jobs:

  build-test-publish-deploy:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:

      #######################################################
      # Repository Checkout
      #######################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #######################################################
      # Node.js Environment
      #######################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      #######################################################
      # Install Project Dependencies
      #######################################################

      - name: Install Dependencies
        run: npm ci

      #######################################################
      # Execute Automated Tests
      #######################################################

      - name: Run Unit Tests
        run: npm test

      #######################################################
