name: TechWave K8s Validation

on:
  push:
    branches:
      - main
    paths:
      - 'app/k8s/**'
      - 'k8s/**'
      - '.github/workflows/k8s-validation.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'app/k8s/**'
      - 'k8s/**'

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibm-cloud-tools/yamllint-action@v1
        with:
          strict: true
        continue-on-error: true

  kubeval:
    name: Kubeval - Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests with kubeval
        uses: instrumenta/kubeval-action@master
        with:
          files: app/k8s/,k8s/
          strict: true
        continue-on-error: true

  kube-linter:
    name: KubeLinter - Security & Best Practices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: app/k8s/
          format: sarif
          output-file: kube-linter-results.sarif
        continue-on-error: true

      - name: Upload KubeLinter results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: kube-linter-results.sarif
          category: kube-linter

  kubectl-dry-run:
    name: Kubectl Dry-Run Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Validate all manifests with kubectl
        run: |
          echo "=== Validating namespace.yaml ==="
          kubectl apply -f app/k8s/namespace.yaml --dry-run=client -o yaml > /dev/null
          
          echo "=== Validating configmap.yaml ==="
          kubectl apply -f app/k8s/configmap.yaml --dry-run=client -o yaml > /dev/null
          
          echo "=== Validating secret.yaml ==="
          kubectl apply -f app/k8s/secret.yaml --dry-run=client -o yaml > /dev/null
          
          echo "=== Validating deployment-blue.yaml ==="
          kubectl apply -f app/k8s/deployment-blue.yaml --dry-run=client -o yaml > /dev/null
          
          echo "=== Validating deployment-green.yaml ==="
          kubectl apply -f app/k8s/deployment-green.yaml --dry-run=client -o yaml > /dev/null
          
          echo "=== Validating service.yaml ==="
          kubectl apply -f app/k8s/service.yaml --dry-run=client -o yaml > /dev/null
          
          echo "=== Validating servicemonitor.yaml ==="
          kubectl apply -f k8s/servicemonitor.yaml --dry-run=client -o yaml > /dev/null
          
          echo "✅ All manifests validated successfully"

  resource-check:
    name: Resource Limits Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check CPU/Memory limits in deployments
        run: |
          echo "=== Checking resource limits ==="
          for file in app/k8s/deployment-*.yaml; do
            echo "Checking $file..."
            if grep -q "resources:" "$file"; then
              echo "✓ Resources defined in $file"
              grep -A 5 "resources:" "$file"
            else
              echo "⚠ WARNING: No resources defined in $file"
            fi
          done

  summary:
    name: K8s Validation Summary
    runs-on: ubuntu-latest
    needs: [yaml-lint, kubeval, kube-linter, kubectl-dry-run, resource-check]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## ✅ Kubernetes Manifest Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **YAML Lint**: ${{ needs.yaml-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Kubeval**: ${{ needs.kubeval.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **KubeLinter**: ${{ needs.kube-linter.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Kubectl Dry-Run**: ${{ needs.kubectl-dry-run.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Check**: ${{ needs.resource-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ All K8s manifests validated before deployment" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with K8s Validation Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Kubernetes Manifest Validation

| Check | Status |
|-------|--------|
| YAML Lint | ${{ needs.yaml-lint.result }} |
| Kubeval | ${{ needs.kubeval.result }} |
| KubeLinter | ${{ needs.kube-linter.result }} |
| Kubectl Dry-Run | ${{ needs.kubectl-dry-run.result }} |
| Resource Limits | ${{ needs.resource-check.result }} |

✨ All K8s manifests validated before deployment`
            });
