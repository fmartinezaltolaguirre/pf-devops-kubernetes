#############################################################
# TechWave DevOps Platform
#
# Blue/Green Deployment Pipeline
#
# Responsibilities:
# - Validate source code and tests
# - Build and scan Docker images
# - Publish to GHCR with commit image tag
# - Deploy green version in parallel
# - Validate green readiness and health
# - Switch active traffic to green
# - Automatic rollback to blue on failure
#
#############################################################

name: TechWave Blue/Green Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/blue-green.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/techwave-app
  KUBE_NAMESPACE: techwave
  KUBECONFIG_PATH: $HOME/.kube/config

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    outputs:
      image-tag: ${{ steps.vars.outputs.image-tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --coverage

      - name: Audit Dependencies
        run: npm audit --audit-level=moderate || true

      - name: Set Image Tag
        id: vars
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-12)
          echo "image-tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image-tag=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.image-tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-green:
    name: Deploy Green Version
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "${KUBE_CONFIG_B64:-}" ]; then
            echo "::error::The repository secret KUBE_CONFIG is not configured."
            exit 1
          fi

          mkdir -p "$(dirname "$KUBECONFIG_PATH")"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"

          export KUBECONFIG="$KUBECONFIG_PATH"
          kubectl config view --minify >/dev/null
          kubectl cluster-info

      - name: Deploy Green Version
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.image-tag }}
          echo "Deploying green with image: $IMAGE"
          kubectl -n ${{ env.KUBE_NAMESPACE }} set image deployment/techwave-green techwave=$IMAGE --record

      - name: Wait for Green Rollout
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl -n ${{ env.KUBE_NAMESPACE }} rollout status deployment/techwave-green --timeout=300s

      - name: Verify Green Pods
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl -n ${{ env.KUBE_NAMESPACE }} get pods -l version=green -o wide
          kubectl -n ${{ env.KUBE_NAMESPACE }} wait --for=condition=ready pod -l version=green --timeout=180s

  validate-green:
    name: Validate Green
    runs-on: ubuntu-latest
    needs: deploy-green

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "${KUBE_CONFIG_B64:-}" ]; then
            echo "::error::The repository secret KUBE_CONFIG is not configured."
            exit 1
          fi

          mkdir -p "$(dirname "$KUBECONFIG_PATH")"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"

          export KUBECONFIG="$KUBECONFIG_PATH"
          kubectl config view --minify >/dev/null

      - name: Health Check Green
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl -n ${{ env.KUBE_NAMESPACE }} port-forward svc/techwave-green 3000:80 >/dev/null 2>&1 &
          PF_PID=$!
          sleep 5

          echo "Checking /health..."
          curl -sf http://localhost:3000/health

          echo "Checking /version..."
          curl -sf http://localhost:3000/version

          echo "Checking /metrics..."
          curl -sf http://localhost:3000/metrics | head -20

          kill $PF_PID

      - name: Smoke Test Green
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl -n ${{ env.KUBE_NAMESPACE }} port-forward svc/techwave-green 3000:80 >/dev/null 2>&1 &
          PF_PID=$!
          sleep 5

          for i in {1..10}; do
            curl -sf http://localhost:3000/ > /dev/null
            sleep 1
          done

          kill $PF_PID
          echo "Smoke tests passed"

  switch-traffic:
    name: Switch Traffic to Green
    runs-on: ubuntu-latest
    needs: [deploy-green, validate-green]
    if: success()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "${KUBE_CONFIG_B64:-}" ]; then
            echo "::error::The repository secret KUBE_CONFIG is not configured."
            exit 1
          fi

          mkdir -p "$(dirname "$KUBECONFIG_PATH")"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"

          export KUBECONFIG="$KUBECONFIG_PATH"
          kubectl config view --minify >/dev/null

      - name: Activate Green Traffic
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl -n ${{ env.KUBE_NAMESPACE }} patch svc techwave-active \
            --type merge \
            -p '{"spec":{"selector":{"app":"techwave","version":"green"}}}'

          echo "Traffic switched to green"
          kubectl -n ${{ env.KUBE_NAMESPACE }} get svc techwave-active -o jsonpath='{.spec.selector}'

      - name: Production Smoke Test
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl -n ${{ env.KUBE_NAMESPACE }} port-forward svc/techwave-active 3000:80 >/dev/null 2>&1 &
          PF_PID=$!
          sleep 5

          curl -sf http://localhost:3000/health
          curl -sf http://localhost:3000/metrics > /dev/null

          kill $PF_PID
          echo "Production smoke test passed"

  rollback:
    name: Rollback to Blue
    runs-on: ubuntu-latest
    needs: [deploy-green, validate-green, switch-traffic]
    if: failure()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "${KUBE_CONFIG_B64:-}" ]; then
            echo "::error::The repository secret KUBE_CONFIG is not configured."
            exit 1
          fi

          mkdir -p "$(dirname "$KUBECONFIG_PATH")"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"

          export KUBECONFIG="$KUBECONFIG_PATH"
          kubectl config view --minify >/dev/null

      - name: Rollback Traffic to Blue
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl -n ${{ env.KUBE_NAMESPACE }} patch svc techwave-active \
            --type merge \
            -p '{"spec":{"selector":{"app":"techwave","version":"blue"}}}'

          echo "Traffic reverted to blue"

      - name: Undo Green Deployment
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          kubectl -n ${{ env.KUBE_NAMESPACE }} rollout undo deployment/techwave-green
          kubectl -n ${{ env.KUBE_NAMESPACE }} rollout status deployment/techwave-green --timeout=180s
